[package]
name = "pull"
version = "0.1.0"
edition = "2024"
description = "Multi-repo git wrapper driven by pullfile.plist"

# Every feature is optional and independent: build only what you use, e.g.
#   cargo install --path . --no-default-features --features env,hooks,https
# A pullfile section whose feature is compiled out (`env`, `hooks`, `lint`, `ignore`,
# `jobs`) is kept verbatim when pull rewrites the pullfile, just not acted on.
[features]
default = ["env", "hooks", "lint", "conventional", "ignore", "worktree", "launchd", "mcp", "tool", "https", "ssh"]
# pullfile `env` + local.toml `[env]`; `pull env` / `pull shell`.
env = ["dep:pull-env"]
# pullfile `hooks`: precommit / postcommit / pull.
hooks = ["dep:pull-hooks"]
# pullfile `lint`: commit message rules; `pull lint`.
lint = ["dep:pull-lint"]
# lint `conventional` (Conventional Commits parser).
conventional = ["lint", "pull-lint/conventional"]
# pullfile `ignore`: patterns kept in every repo's .git/info/exclude.
ignore = ["dep:pull-ignore"]
# `pull worktree`: workspace-wide git worktrees.
worktree = ["dep:pull-worktree"]
# pullfile `jobs`, `pull launchctl`, `pull session` (PTY job daemon); MCP session tools.
launchd = ["dep:pull-launchd", "pull-mcp?/sessions"]
# pullfile `tool`: workspace packages (Linuxbrew bottles) in .pull/tool, on PATH via env.
tool = ["dep:pull-tool"]
# `pull mcp`: MCP server for agents.
mcp = ["dep:pull-mcp"]
# git transports.
https = ["pull-git/https"]
ssh = ["pull-git/ssh"]

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.8", features = ["derive"] }
git2.workspace = true
serde_json.workspace = true
toml.workspace = true
pull-core = { path = "crates/pull-core" }
pull-git = { path = "crates/pull-git", default-features = false }
pull-env = { path = "crates/pull-env", optional = true }
pull-hooks = { path = "crates/pull-hooks", optional = true }
pull-lint = { path = "crates/pull-lint", optional = true, default-features = false }
pull-ignore = { path = "crates/pull-ignore", optional = true }
pull-worktree = { path = "crates/pull-worktree", optional = true }
pull-launchd = { path = "crates/pull-launchd", optional = true }
pull-mcp = { path = "crates/pull-mcp", optional = true, default-features = false }
pull-tool = { path = "crates/pull-tool", optional = true }

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.dependencies]
anyhow = "1.0.104"
git2 = { version = "0.21.0", default-features = false }
plist = "1.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
toml = "1.2.1"
