[package]
name = "pull"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
auth-git2 = "0.6.0"
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
git-conventional = "1.1.0"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
nix = { version = "0.32.0", features = ["signal", "process", "term"] }
plist = "1.10.4"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
shlex = "2.0.1"
toml = "1.2.1"
vt100 = "0.18.1"
